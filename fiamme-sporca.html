<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMOSTRANGERS Fiamme sporca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #02030a;
    --ink: #f3f0e8;
    --ink-dim: rgba(243, 240, 232, 0.55);
    --halo-yellow: #e6f26a;
    --halo-blue: #2f5bff;
    --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    /* layout: one full-height stage, eclipse centred at 46% height, title across the disc, links bottom-left */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--black); color: var(--ink); }
  body { overflow: hidden; font-family: var(--font-display); }

  .hero { position: relative; width: 100%; height: 100%; min-height: 420px; background: var(--black); }
  #sky { position: absolute; inset: 0; display: block; }

  .title {
    position: absolute; left: 0; right: 0; top: 46%;
    transform: translateY(-50%);
    margin: 0; padding: 0 16px;
    text-align: center; pointer-events: none;
    font-weight: 300;
    font-size: clamp(1.05rem, 4.4vw, 4rem);
    letter-spacing: 0.42em;
    padding-left: calc(16px + 0.42em);   /* balances the trailing letter-spacing */
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(2, 3, 10, 0.9), 0 0 2px rgba(2, 3, 10, 0.9);
  }
  .title span {
    display: inline-block;
    animation: rise 2.2s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay: calc(var(--i) * 90ms + 400ms);
  }
  @keyframes rise {
    from { opacity: 0; filter: blur(12px); transform: translateY(10px); }
    to   { filter: blur(0); transform: none; }
  }

  .links {
    position: absolute; left: 24px; right: 24px; bottom: 22px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-size: 0.95rem; letter-spacing: 0.22em; text-transform: uppercase;
    animation: fade 2.4s ease 1.6s backwards;
  }
  .links a { color: var(--ink-dim); text-decoration: none; transition: color .25s; }
  .links a:hover, .links a:focus-visible { color: var(--ink); }
  .links a:focus-visible { outline: 1px solid var(--halo-yellow); outline-offset: 4px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .title span, .links { animation: none; }
  }

  /* title: one uniform color, slightly soft */
  .title { color: #cfc9b8; filter: blur(0.5px); text-shadow: none; font-weight: 400; }
  .links a { color: rgba(214, 208, 190, 0.45); }
</style>
</head>
<body>
<main class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <h1 class="title" aria-label="ALMOSTRANGERS"><span style="--i:0">A</span><span style="--i:1">L</span><span style="--i:2">M</span><span style="--i:3">O</span><span style="--i:4">S</span><span style="--i:5">T</span><span style="--i:6">R</span><span style="--i:7">A</span><span style="--i:8">N</span><span style="--i:9">G</span><span style="--i:10">E</span><span style="--i:11">R</span><span style="--i:12">S</span></h1>
  <nav class="links" aria-label="Link">
    <a href="https://www.instagram.com/almostrangersmusic/">Instagram</a>
    <a href="https://www.instagram.com/almostrangersmusic/">@almostrangersmusic</a>
  </nav>
</main>

<script>
(function () {
  var TAU = Math.PI * 2;
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // dirty palette: bone, ochre, steel blue, soot
  var P = {
    halo0: 'rgba(110,94,58,', halo1: 'rgba(56,50,56,', halo2: 'rgba(16,22,48,',
    c0: 'rgba(176,168,142,', c1: 'rgba(112,90,78,', c2: 'rgba(54,64,84,',
    glow: 'rgba(112,102,66,'
  };

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = rng(20261120);
  function hash(k) { var x = Math.sin(k * 12.9898) * 43758.5453; return x - Math.floor(x); }

  var N = 4200, SEG = 7;
  var ang0 = new Float32Array(N), rn = new Float32Array(N), rc = new Float32Array(N), rph = new Float32Array(N);
  var jit = new Float32Array(N * SEG), brk = new Int8Array(N), dead = new Uint8Array(N), sel = new Float32Array(N), vis = new Uint8Array(N);
  for (var i = 0; i < N; i++) {
    ang0[i] = TAU * (i + rand() * 0.9) / N;
    rn[i] = rand(); rc[i] = (rand() - 0.5) * 0.7; rph[i] = rand() * TAU;
    brk[i] = rand() < 0.35 ? 2 + Math.floor(rand() * 4) : -1;
    dead[i] = rand() < 0.04 ? 1 : 0;
    sel[i] = rand();
    for (var j = 0; j < SEG; j++) jit[i * SEG + j] = rand() - 0.5;
  }
  var lv = new Float32Array(N); for (var q0 = 0; q0 < N; q0++) lv[q0] = rand();
  var PX = new Float32Array(N * SEG), PY = new Float32Array(N * SEG);

  var stars = [];
  for (var k = 0; k < 0; k++) stars.push({ x: rand(), y: rand(), r: 0.6 + rand() * 0.8, sp: 0.4 + rand() * 1.2, ph: rand() * TAU });
  var blots = [], patches = [], chips = [];
  for (var b = 0; b < 14; b++) blots.push({ a: rand() * TAU, d: 1.0 + rand() * 0.7, s: 0.3 + rand() * 0.45, al: 0.5 + rand() * 0.35 });
  var smoke = [];
  for (var sm = 0; sm < 8; sm++) smoke.push({ a: rand() * TAU, d: 0.9 + rand() * 0.8, s: 0.5 + rand() * 0.6, al: sm < 5 ? 0.30 + rand() * 0.2 : 0.05 + rand() * 0.05, sp: (rand() < 0.5 ? -1 : 1) * (0.02 + rand() * 0.03), ph: rand() * TAU, dark: sm < 5 });
  for (var q = 0; q < 6; q++) patches.push({ a: rand() * TAU, span: 0.15 + rand() * 0.5, w: 1.2 + rand() * 1.6, ph: rand() * TAU });
  for (var c = 0; c < 9; c++) chips.push({ a: rand() * TAU, span: 0.02 + rand() * 0.06 });

  // charcoal-like tangles: long wobbly strokes that start at the ring
  var tangles = [];
  for (var tg = 0; tg < 0; tg++) {   // thick background strokes removed
    var steps = [];
    for (var sj = 0; sj < 16; sj++) steps.push(rand() - 0.5);
    tangles.push({ a: rand() * TAU, len: 0.5 + rand() * 1.5, w: 2 + rand() * 3.2, al: 0.10 + rand() * 0.12, ph: rand() * TAU, steps: steps, wob: 0.15 + rand() * 0.3 });
  }
  var OS = 0.5, oc = document.createElement('canvas'), octx = oc.getContext('2d');

  var tgt = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };

  function wob(a) { return 0.5 * Math.sin(5 * a + 1.3) + 0.3 * Math.sin(11 * a + 0.4) + 0.2 * Math.sin(23 * a + 2.1); }

  function fitTitle() {
    var h = document.querySelector('.title');
    if (!h) return;
    var sp = h.querySelectorAll('span');
    if (!sp.length) return;
    h.style.fontSize = '100px';
    var a = sp[0].getBoundingClientRect(), z = sp[sp.length - 1].getBoundingClientRect();
    var w100 = z.right - a.left;
    if (w100 <= 0) return;
    h.style.fontSize = Math.max(10, 100 * (R * 2 * 0.8) / w100) + 'px';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

  function size() {
    var bb = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, bb.width); H = Math.max(1, bb.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx = W / 2; cy = H * 0.46;
    R = Math.min(W * 0.24, H * 0.225);
    if (W < 600) R = Math.min(W * 0.36, H * 0.3);
    oc.width = Math.max(1, Math.round(W * DPR * OS)); oc.height = Math.max(1, Math.round(H * DPR * OS));
    fitTitle();
  }

  // how much light there is around the disc at each angle: bright patches and dim ones, slowly drifting
  function dens(a, t) {
    var v = 0.5 + 0.5 * (0.5 * Math.sin(2 * a + 1 + t * 0.05) + 0.3 * Math.sin(5 * a + 2.2 - t * 0.04) + 0.25 * Math.sin(9 * a - 1 + t * 0.03));
    return Math.max(0.1, Math.min(1, (v - 0.15) * 1.5));
  }

  function field(a, t) {
    var v = 0.5 * Math.sin(3 * a + t * 0.30) + 0.3 * Math.sin(7 * a - t * 0.50 + 1) + 0.2 * Math.sin(13 * a + t * 0.70 + 2);
    return Math.max(0.05, 0.55 + 0.55 * v);
  }

  function ringPath(r0, a0, a1, t) {
    var steps = Math.max(4, Math.round((a1 - a0) / TAU * 220));
    ctx.beginPath();
    for (var s = 0; s <= steps; s++) {
      var th = a0 + (a1 - a0) * s / steps;
      var rr = r0 + 0.9;   // ring sits right against the disc
      var x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  function drawDirty(c, am, wm) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    var passes = [[0, 2, P.c0, 0.75, 0.30], [2, 4, P.c1, 0.62, 0.23], [4, 6, P.c2, 0.5, 0.15]];
    var gw = [0.8, 1.15, 1.9], ga = [0.7, 1.0, 1.15];
    for (var gi = 0; gi < 3; gi++) {
      for (var p = 0; p < passes.length; p++) {
        var ps = passes[p];
        c.strokeStyle = ps[2] + (ps[4] * ga[gi] * am) + ')';
        c.lineWidth = ps[3] * gw[gi] * wm;
        c.beginPath();
        for (var m = gi; m < N; m += 3) {
          if (dead[m] || !vis[m]) continue;
          var o = m * SEG;
          c.moveTo(PX[o + ps[0]], PY[o + ps[0]]);
          for (var qq = ps[0] + 1; qq <= ps[1]; qq++) {
            if (qq === brk[m]) c.moveTo(PX[o + qq], PY[o + qq]);
            else c.lineTo(PX[o + qq], PY[o + qq]);
          }
        }
        c.stroke();
      }
    }
    c.lineCap = 'butt';
  }

  // radial gradient with an eased falloff (no slope breaks), so it shows no ring-shaped bands
  function easedGrad(x, y, r0, r1, col, a, rising) {
    var g = ctx.createRadialGradient(x, y, r0, x, y, r1);
    for (var i = 0; i <= 10; i++) {
      var u = i / 10, sm = u * u * (3 - 2 * u);
      g.addColorStop(u, col + (a * (rising ? sm : 1 - sm)) + ')');
    }
    return g;
  }

  // invisible dither: a tiny noise tile that breaks up the 8-bit steps of the dark gradients
  var ditherPat = null;
  function ditherTile() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d'), im = x.createImageData(128, 128), d = im.data;
    for (var q = 0; q < 128 * 128; q++) { var v = Math.floor(rand() * 3.2); d[q * 4] = d[q * 4 + 1] = d[q * 4 + 2] = v; d[q * 4 + 3] = 255; }
    x.putImageData(im, 0, 0);
    return c;
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#040506';
    ctx.fillRect(0, 0, W, H);

    var e = Math.max(0, t - 6);
    var ramp = Math.min(1, 0.15 + e / 3.5);
    var br = 0.88 + 0.12 * hash(Math.floor(t * 11));                       // flicker, ~11 times per second
    var pulse = Math.min(1, Math.max(0, 0.5 + 0.4 * Math.sin(t * 1.5) + 0.12 * Math.sin(t * 3.1 + 1)));

    ctx.fillStyle = '#cfc9b6';
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.06 + 0.1 * Math.sin(t * st.sp + st.ph);
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';

    ctx.fillStyle = easedGrad(cx, cy, R * 0.95, R * 1.9, P.halo0, (0.13 + 0.06 * pulse) * ramp * br);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.9, 0, TAU); ctx.fill();
    ctx.fillStyle = easedGrad(cx, cy, R * 0.95, R * 2.5, P.halo1, (0.07 + 0.04 * pulse) * ramp * br);
    ctx.beginPath(); ctx.arc(cx, cy, R * 2.5, 0, TAU); ctx.fill();

    // ragged filaments: jittered points, uneven widths, broken pieces, missing ones
    var r0 = R * 1.005;
    for (var n = 0; n < N; n++) {
      var a = ang0[n] + t * 0.01;
      var dn = dens(a, t);
      vis[n] = sel[n] < 0.35 + 0.65 * dn ? 1 : 0;
      var L = R * (0.05 + 0.9 * Math.pow(field(a, t), 1.3) * Math.pow(rn[n], 0.9) * (0.75 + 0.25 * Math.sin(t * 1.7 + rph[n]))) * (0.93 + 0.14 * pulse) * (0.55 + 0.45 * dn) * ramp;
      var cap = R * 0.5 * ramp;
      L = cap * Math.tanh(L / cap) * (0.72 + 0.5 * lv[n]);
      var lf = Math.min(1, L / (R * 0.5));
      if (vis[n] && sel[n] > 1 - 0.85 * lf * lf * lf) vis[n] = 0;   // the longest strands mostly disappear
      L *= 1 - 0.25 * lf * lf;   // soft cap + per-strand length noise: tips never line up on a circle
      var curl = rc[n] * (0.6 + 0.4 * Math.sin(t * 0.4 + rph[n]));
      var wig = 0.6 + 0.4 * Math.sin(t * 2 + rph[n] * 3);
      for (var j2 = 0; j2 < SEG; j2++) {
        var sv = j2 / (SEG - 1), jv = jit[n * SEG + j2];
        var rr = r0 + L * sv + jv * R * 0.012;
        var aa = a + curl * sv * sv + jv * 0.035 * sv * wig;
        PX[n * SEG + j2] = cx + Math.cos(aa) * rr;
        PY[n * SEG + j2] = cy + Math.sin(aa) * rr;
      }
    }
    // smeared layer (drawn small, scaled up) + ragged layer on top: ink that bled
    octx.setTransform(OS * DPR, 0, 0, OS * DPR, 0, 0);
    octx.globalCompositeOperation = 'source-over';
    octx.clearRect(0, 0, W, H);
    octx.globalCompositeOperation = 'lighter';
    drawDirty(octx, 0.40 * br, 1.7);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(oc, 0, 0, W, H);
    drawDirty(ctx, 0.55 * br, 1.0);

    // tangles
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var ti = 0; ti < tangles.length; ti++) {
      var tn = tangles[ti], ang = tn.a + t * 0.01, rad = R * 1.01;
      ctx.strokeStyle = P.c0 + (tn.al * (0.7 + 0.3 * Math.sin(t * 0.6 + tn.ph)) * ramp * br) + ')';
      ctx.lineWidth = tn.w;
      ctx.beginPath();
      var tx0 = cx + Math.cos(ang) * rad, ty0 = cy + Math.sin(ang) * rad;
      ctx.moveTo(tx0, ty0);
      var dirA = ang, step = R * tn.len * 0.6 * ramp * (0.8 + 0.3 * pulse) / 16;
      var px2 = tx0, py2 = ty0;
      for (var sj2 = 0; sj2 < 16; sj2++) {
        dirA += tn.steps[sj2] * tn.wob * 2 + Math.sin(t * 0.5 + tn.ph + sj2) * 0.04;
        px2 += Math.cos(dirA) * step; py2 += Math.sin(dirA) * step;
        ctx.lineTo(px2, py2);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    ctx.fillStyle = easedGrad(cx, cy, R, R * 1.28, P.glow, (0.15 + 0.10 * pulse) * ramp * br);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.28, 0, TAU); ctx.fill();

    // soot smudges eating into the glow
    ctx.globalCompositeOperation = 'source-over';
    for (var bi = 0; bi < blots.length; bi++) {
      var bl = blots[bi];
      var bx = cx + Math.cos(bl.a) * R * bl.d, by = cy + Math.sin(bl.a) * R * bl.d, bs = R * bl.s;
      ctx.fillStyle = easedGrad(bx, by, 0, bs, 'rgba(4,5,6,', bl.al);
      ctx.beginPath(); ctx.arc(bx, by, bs, 0, TAU); ctx.fill();
    }

    // slow smoke drifting in front of the corona (never over the disc or the title)
    for (var si = 0; si < smoke.length; si++) {
      var sk = smoke[si], sa = sk.a + t * sk.sp;
      var sx = cx + Math.cos(sa) * R * sk.d, sy = cy + Math.sin(sa) * R * sk.d * 0.85;
      var ss = R * sk.s * (1 + 0.12 * Math.sin(t * 0.3 + sk.ph));
      var sc = sk.dark ? 'rgba(6,6,7,' : 'rgba(78,70,62,';
      ctx.fillStyle = easedGrad(sx, sy, 0, ss, sc, sk.al * ramp);
      ctx.beginPath(); ctx.arc(sx, sy, ss, 0, TAU); ctx.fill();
    }

    // uneven black disc
    var mx = Math.cos(t * 0.12) * R * 0.012 + ptr.x * R * 0.02;
    var my = Math.sin(t * 0.09) * R * 0.012 + ptr.y * R * 0.016;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    for (var d2 = 0; d2 <= 160; d2++) {
      var th2 = TAU * d2 / 160, r2 = R + 0.4;
      var x2 = cx + mx + Math.cos(th2) * r2, y2 = cy + my + Math.sin(th2) * r2;
      if (d2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.fill();

    // worn ring: wobbly, dim, with brighter patches and chipped gaps
    ctx.save();
    ctx.translate(mx, my);
    var rgd = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rgd.addColorStop(0, '#b8b070'); rgd.addColorStop(0.5, '#6f8f86'); rgd.addColorStop(1, '#3d5a8a');
    ctx.strokeStyle = rgd; ctx.globalAlpha = 0.92 * ramp; ctx.lineWidth = 1.6;
    ctx.shadowBlur = 0;
    for (var rk = 0; rk < 120; rk++) {
      var ra0 = TAU * rk / 120, ra1 = TAU * (rk + 1) / 120 + 0.01;
      ctx.globalAlpha = (0.4 + 0.55 * dens(ra0 + TAU / 240, t)) * ramp;
      ringPath(R, ra0, ra1, t); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;

    // heavy vignette
    ctx.fillStyle = easedGrad(cx, cy, Math.min(W, H) * 0.3, Math.max(W, H) * 0.78, 'rgba(2,3,4,', 0.78, true);
    ctx.fillRect(0, 0, W, H);

    // dither, kept outside the black disc so the disc and the title stay perfectly clean
    if (!ditherPat) ditherPat = ctx.createPattern(ditherTile(), 'repeat');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(cx + mx, cy + my, R + 2, 0, TAU);
    ctx.clip('evenodd');
    ctx.fillStyle = ditherPat;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  size();
  window.addEventListener('resize', function () { size(); if (still) draw(14); });
  if (still) { draw(14); return; }
  window.addEventListener('pointermove', function (e) {
    var bb = cv.getBoundingClientRect();
    tgt.x = ((e.clientX - bb.left) / bb.width - 0.5) * 2;
    tgt.y = ((e.clientY - bb.top) / bb.height - 0.5) * 2;
  });
  var t0 = performance.now();
  function loop(now) {
    ptr.x += (tgt.x - ptr.x) * 0.04; ptr.y += (tgt.y - ptr.y) * 0.04;
    draw(((now - t0) / 1000) * 0.55 + 6);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
