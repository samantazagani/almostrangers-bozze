<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMOSTRANGERS Sporca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #02030a;
    --ink: #f3f0e8;
    --ink-dim: rgba(243, 240, 232, 0.55);
    --halo-yellow: #e6f26a;
    --halo-blue: #2f5bff;
    --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    /* layout: one full-height stage, eclipse centred at 46% height, title across the disc, links bottom-left */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--black); color: var(--ink); }
  body { overflow: hidden; font-family: var(--font-display); }

  .hero { position: relative; width: 100%; height: 100%; min-height: 420px; background: var(--black); }
  #sky { position: absolute; inset: 0; display: block; }

  .title {
    position: absolute; left: 0; right: 0; top: 46%;
    transform: translateY(-50%);
    margin: 0; padding: 0 16px;
    text-align: center; pointer-events: none;
    font-weight: 300;
    font-size: clamp(1.05rem, 4.4vw, 4rem);
    letter-spacing: 0.42em;
    padding-left: calc(16px + 0.42em);   /* balances the trailing letter-spacing */
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(2, 3, 10, 0.9), 0 0 2px rgba(2, 3, 10, 0.9);
  }
  .title span {
    display: inline-block;
    animation: rise 2.2s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay: calc(var(--i) * 90ms + 400ms);
  }
  @keyframes rise {
    from { opacity: 0; filter: blur(12px); transform: translateY(10px); }
    to   { filter: blur(0); transform: none; }
  }

  .links {
    position: absolute; left: 24px; right: 24px; bottom: 22px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-size: 0.95rem; letter-spacing: 0.22em; text-transform: uppercase;
    animation: fade 2.4s ease 1.6s backwards;
  }
  .links a { color: var(--ink-dim); text-decoration: none; transition: color .25s; }
  .links a:hover, .links a:focus-visible { color: var(--ink); }
  .links a:focus-visible { outline: 1px solid var(--halo-yellow); outline-offset: 4px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .title span, .links { animation: none; }
  }

  /* dirty look: bone-colored, uneven, flickering title with rough edges */
  .title { color: #d6d0be; filter: url(#rough); text-shadow: none; font-weight: 400; animation: flick 6s steps(1, end) infinite; }
  .title span:nth-child(3n+1) { opacity: .84; }
  .title span:nth-child(4n+2) { opacity: .93; }
  .title span:nth-child(5n)   { opacity: .72; }
  @keyframes flick { 0%,100% { opacity: 1; } 7% { opacity: .82; } 9% { opacity: 1; } 41% { opacity: .9; } 43% { opacity: 1; } 77% { opacity: .76; } 78% { opacity: 1; } }
  .links a { color: rgba(214, 208, 190, 0.45); }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <h1 class="title" aria-label="ALMOSTRANGERS"><span style="--i:0">A</span><span style="--i:1">L</span><span style="--i:2">M</span><span style="--i:3">O</span><span style="--i:4">S</span><span style="--i:5">T</span><span style="--i:6">R</span><span style="--i:7">A</span><span style="--i:8">N</span><span style="--i:9">G</span><span style="--i:10">E</span><span style="--i:11">R</span><span style="--i:12">S</span></h1>
  <nav class="links" aria-label="Link">
    <a href="https://www.instagram.com/almostrangersmusic/">Instagram</a>
    <a href="https://www.instagram.com/almostrangersmusic/">@almostrangersmusic</a>
  </nav>
</main>

<script>
(function () {
  var TAU = Math.PI * 2;
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // dirty palette: bone, ochre, steel blue, soot
  var P = {
    halo0: 'rgba(130,118,66,', halo1: 'rgba(48,78,120,', halo2: 'rgba(16,22,48,',
    c0: 'rgba(214,200,150,', c1: 'rgba(96,130,152,', c2: 'rgba(48,64,100,',
    glow: 'rgba(150,136,80,'
  };

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = rng(20261120);
  function hash(k) { var x = Math.sin(k * 12.9898) * 43758.5453; return x - Math.floor(x); }

  var N = 800, SEG = 7;
  var ang0 = new Float32Array(N), rn = new Float32Array(N), rc = new Float32Array(N), rph = new Float32Array(N);
  var jit = new Float32Array(N * SEG), brk = new Int8Array(N), dead = new Uint8Array(N);
  for (var i = 0; i < N; i++) {
    ang0[i] = TAU * (i + rand() * 0.9) / N;
    rn[i] = rand(); rc[i] = (rand() - 0.5) * 0.7; rph[i] = rand() * TAU;
    brk[i] = rand() < 0.35 ? 2 + Math.floor(rand() * 4) : -1;
    dead[i] = rand() < 0.10 ? 1 : 0;
    for (var j = 0; j < SEG; j++) jit[i * SEG + j] = rand() - 0.5;
  }
  var PX = new Float32Array(N * SEG), PY = new Float32Array(N * SEG);

  var stars = [];
  for (var k = 0; k < 40; k++) stars.push({ x: rand(), y: rand(), r: 0.6 + rand() * 0.8, sp: 0.4 + rand() * 1.2, ph: rand() * TAU });
  var blots = [], patches = [], chips = [];
  for (var b = 0; b < 8; b++) blots.push({ a: rand() * TAU, d: 1.0 + rand() * 0.9, s: 0.18 + rand() * 0.28, al: 0.35 + rand() * 0.35 });
  for (var q = 0; q < 6; q++) patches.push({ a: rand() * TAU, span: 0.15 + rand() * 0.5, w: 1.2 + rand() * 1.6, ph: rand() * TAU });
  for (var c = 0; c < 9; c++) chips.push({ a: rand() * TAU, span: 0.02 + rand() * 0.06 });

  // film grain tiles: faint noise plus a little dust
  var tiles = [];
  for (var tl = 0; tl < 3; tl++) {
    var tc = document.createElement('canvas'); tc.width = tc.height = 192;
    var tx = tc.getContext('2d'), im = tx.createImageData(192, 192), d = im.data;
    for (var px = 0; px < 192 * 192; px++) {
      var v = rand() * 13;
      if (rand() < 0.0025) v = 60 + rand() * 70;
      d[px * 4] = d[px * 4 + 1] = d[px * 4 + 2] = v; d[px * 4 + 3] = 255;
    }
    tx.putImageData(im, 0, 0);
    tiles.push(tc);
  }
  var tilePat = null;

  var tgt = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };

  function wob(a) { return 0.5 * Math.sin(5 * a + 1.3) + 0.3 * Math.sin(11 * a + 0.4) + 0.2 * Math.sin(23 * a + 2.1); }

  function fitTitle() {
    var h = document.querySelector('.title');
    if (!h) return;
    var sp = h.querySelectorAll('span');
    if (!sp.length) return;
    h.style.fontSize = '100px';
    var a = sp[0].getBoundingClientRect(), z = sp[sp.length - 1].getBoundingClientRect();
    var w100 = z.right - a.left;
    if (w100 <= 0) return;
    h.style.fontSize = Math.max(10, 100 * (R * 2 * 0.8) / w100) + 'px';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

  function size() {
    var bb = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, bb.width); H = Math.max(1, bb.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx = W / 2; cy = H * 0.46;
    R = Math.min(W * 0.24, H * 0.225);
    if (W < 600) R = Math.min(W * 0.36, H * 0.3);
    fitTitle();
  }

  function field(a, t) {
    var v = 0.5 * Math.sin(3 * a + t * 0.30) + 0.3 * Math.sin(7 * a - t * 0.50 + 1) + 0.2 * Math.sin(13 * a + t * 0.70 + 2);
    return Math.max(0.05, 0.55 + 0.55 * v);
  }

  function ringPath(r0, a0, a1, t) {
    var steps = Math.max(4, Math.round((a1 - a0) / TAU * 220));
    ctx.beginPath();
    for (var s = 0; s <= steps; s++) {
      var th = a0 + (a1 - a0) * s / steps;
      var rr = r0 * (1.012 + 0.007 * wob(th));
      var x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#040506';
    ctx.fillRect(0, 0, W, H);

    var e = Math.max(0, t - 6);
    var ramp = Math.min(1, 0.15 + e / 3.5);
    var br = 0.88 + 0.12 * hash(Math.floor(t * 11));                       // flicker, ~11 times per second
    var pulse = Math.min(1, Math.max(0, 0.5 + 0.4 * Math.sin(t * 1.5) + 0.12 * Math.sin(t * 3.1 + 1)));

    ctx.fillStyle = '#cfc9b6';
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.06 + 0.1 * Math.sin(t * st.sp + st.ph);
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';

    var g1 = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 2.5);
    g1.addColorStop(0, P.halo0 + (0.38 + 0.16 * pulse) * ramp * br + ')');
    g1.addColorStop(0.2, P.halo1 + (0.20 + 0.10 * pulse) * ramp * br + ')');
    g1.addColorStop(0.6, P.halo2 + (0.05 * ramp) + ')');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 2.5, 0, TAU); ctx.fill();

    // ragged filaments: jittered points, uneven widths, broken pieces, missing ones
    var r0 = R * 1.005;
    for (var n = 0; n < N; n++) {
      var a = ang0[n] + t * 0.01;
      var L = R * (0.08 + 2.5 * Math.pow(field(a, t), 1.3) * Math.pow(rn[n], 0.9) * (0.75 + 0.25 * Math.sin(t * 1.7 + rph[n]))) * (0.85 + 0.3 * pulse) * ramp;
      var curl = rc[n] * (0.6 + 0.4 * Math.sin(t * 0.4 + rph[n]));
      var wig = 0.6 + 0.4 * Math.sin(t * 2 + rph[n] * 3);
      for (var j2 = 0; j2 < SEG; j2++) {
        var sv = j2 / (SEG - 1), jv = jit[n * SEG + j2];
        var rr = r0 + L * sv + jv * R * 0.012;
        var aa = a + curl * sv * sv + jv * 0.035 * sv * wig;
        PX[n * SEG + j2] = cx + Math.cos(aa) * rr;
        PY[n * SEG + j2] = cy + Math.sin(aa) * rr;
      }
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var passes = [[0, 2, P.c0, 1.2, 0.72], [2, 4, P.c1, 0.9, 0.55], [4, 6, P.c2, 0.7, 0.32]];
    var gw = [0.8, 1.1, 1.8], ga = [0.7, 1.0, 1.15];
    for (var gi = 0; gi < 3; gi++) {
      for (var p = 0; p < passes.length; p++) {
        var ps = passes[p];
        ctx.strokeStyle = ps[2] + (ps[4] * ga[gi] * br) + ')';
        ctx.lineWidth = ps[3] * gw[gi];
        ctx.beginPath();
        for (var m = gi; m < N; m += 3) {
          if (dead[m]) continue;
          var o = m * SEG;
          ctx.moveTo(PX[o + ps[0]], PY[o + ps[0]]);
          for (var qq = ps[0] + 1; qq <= ps[1]; qq++) {
            if (qq === brk[m]) ctx.moveTo(PX[o + qq], PY[o + qq]);
            else ctx.lineTo(PX[o + qq], PY[o + qq]);
          }
        }
        ctx.stroke();
      }
    }
    ctx.lineCap = 'butt';

    var g2 = ctx.createRadialGradient(cx, cy, R, cx, cy, R * 1.28);
    g2.addColorStop(0, P.glow + (0.40 + 0.22 * pulse) * ramp * br + ')');
    g2.addColorStop(1, P.glow + '0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.28, 0, TAU); ctx.fill();

    // soot smudges eating into the glow
    ctx.globalCompositeOperation = 'source-over';
    for (var bi = 0; bi < blots.length; bi++) {
      var bl = blots[bi];
      var bx = cx + Math.cos(bl.a) * R * bl.d, by = cy + Math.sin(bl.a) * R * bl.d, bs = R * bl.s;
      var bg = ctx.createRadialGradient(bx, by, 0, bx, by, bs);
      bg.addColorStop(0, 'rgba(4,5,6,' + bl.al + ')');
      bg.addColorStop(1, 'rgba(4,5,6,0)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, by, bs, 0, TAU); ctx.fill();
    }

    // uneven black disc
    var mx = Math.cos(t * 0.12) * R * 0.012 + ptr.x * R * 0.02;
    var my = Math.sin(t * 0.09) * R * 0.012 + ptr.y * R * 0.016;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    for (var d2 = 0; d2 <= 160; d2++) {
      var th2 = TAU * d2 / 160, r2 = R * (1.0 + 0.006 * wob(th2));
      var x2 = cx + mx + Math.cos(th2) * r2, y2 = cy + my + Math.sin(th2) * r2;
      if (d2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.fill();

    // worn ring: wobbly, dim, with brighter patches and chipped gaps
    ctx.save();
    ctx.translate(mx, my);
    var rgd = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rgd.addColorStop(0, '#b8b070'); rgd.addColorStop(0.5, '#6f8f86'); rgd.addColorStop(1, '#3d5a8a');
    ctx.strokeStyle = rgd; ctx.globalAlpha = 0.6 * ramp * br; ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(120,150,130,0.7)'; ctx.shadowBlur = (8 + 12 * pulse) * ramp;
    ringPath(R, 0, TAU, t); ctx.stroke();
    ctx.shadowBlur = 0;
    for (var pi = 0; pi < patches.length; pi++) {
      var pt = patches[pi];
      ctx.globalAlpha = (0.35 + 0.35 * Math.sin(t * 0.7 + pt.ph)) * ramp * br;
      ctx.strokeStyle = 'rgba(214,206,160,1)'; ctx.lineWidth = pt.w;
      ringPath(R, pt.a, pt.a + pt.span, t); ctx.stroke();
    }
    ctx.globalAlpha = 0.85; ctx.strokeStyle = '#030405'; ctx.lineWidth = 3.4;
    for (var ci = 0; ci < chips.length; ci++) { ringPath(R, chips[ci].a, chips[ci].a + chips[ci].span, t); ctx.stroke(); }
    ctx.restore();
    ctx.globalAlpha = 1;

    // film grain (refreshes ~12 times per second) and scratches
    var fr = Math.floor(t * 12);
    if (!tilePat) tilePat = [];
    var tIdx = fr % 3;
    if (!tilePat[tIdx]) tilePat[tIdx] = ctx.createPattern(tiles[tIdx], 'repeat');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(Math.floor(hash(fr) * 192), Math.floor(hash(fr + 7) * 192));
    ctx.fillStyle = tilePat[tIdx];
    ctx.fillRect(-192, -192, W + 384, H + 384);
    ctx.restore();

    ctx.strokeStyle = 'rgba(220,214,196,1)'; ctx.lineWidth = 0.6;
    var sk = Math.floor(t * 7);
    for (var sc = 0; sc < 3; sc++) {
      var sa = hash(sk * 3 + sc + 1);
      if (sa < 0.55) continue;
      ctx.globalAlpha = 0.05 + 0.07 * hash(sk + sc * 9);
      var sx = hash(sk * 5 + sc * 2) * W, sy = hash(sk * 11 + sc) * H;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + (hash(sk + sc) - 0.5) * 6, sy + 40 + hash(sk * 2 + sc) * H * 0.5); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // heavy vignette
    var vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(2,3,4,0)');
    vg.addColorStop(1, 'rgba(2,3,4,0.9)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  size();
  window.addEventListener('resize', function () { size(); if (still) draw(14); });
  if (still) { draw(14); return; }
  window.addEventListener('pointermove', function (e) {
    var bb = cv.getBoundingClientRect();
    tgt.x = ((e.clientX - bb.left) / bb.width - 0.5) * 2;
    tgt.y = ((e.clientY - bb.top) / bb.height - 0.5) * 2;
  });
  var t0 = performance.now();
  function loop(now) {
    ptr.x += (tgt.x - ptr.x) * 0.04; ptr.y += (tgt.y - ptr.y) * 0.04;
    draw((now - t0) / 1000 + 6);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
