<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMOSTRANGERS Brace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #02030a;
    --ink: #f3f0e8;
    --ink-dim: rgba(243, 240, 232, 0.55);
    --halo-yellow: #e6f26a;
    --halo-blue: #2f5bff;
    --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    /* layout: one full-height stage, eclipse centred at 46% height, title across the disc, links bottom-left */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--black); color: var(--ink); }
  body { overflow: hidden; font-family: var(--font-display); }

  .hero { position: relative; width: 100%; height: 100%; min-height: 420px; background: var(--black); }
  #sky { position: absolute; inset: 0; display: block; }

  .title {
    position: absolute; left: 0; right: 0; top: 46%;
    transform: translateY(-50%);
    margin: 0; padding: 0 16px;
    text-align: center; pointer-events: none;
    font-weight: 300;
    font-size: clamp(1.05rem, 4.4vw, 4rem);
    letter-spacing: 0.42em;
    padding-left: calc(16px + 0.42em);   /* balances the trailing letter-spacing */
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(2, 3, 10, 0.9), 0 0 2px rgba(2, 3, 10, 0.9);
  }
  .title span {
    display: inline-block;
    animation: rise 2.2s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay: calc(var(--i) * 90ms + 400ms);
  }
  @keyframes rise {
    from { opacity: 0; filter: blur(12px); transform: translateY(10px); }
    to   { opacity: 1; filter: blur(0);    transform: none; }
  }

  .links {
    position: absolute; left: 24px; right: 24px; bottom: 22px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-size: 0.95rem; letter-spacing: 0.22em; text-transform: uppercase;
    animation: fade 2.4s ease 1.6s backwards;
  }
  .links a { color: var(--ink-dim); text-decoration: none; transition: color .25s; }
  .links a:hover, .links a:focus-visible { color: var(--ink); }
  .links a:focus-visible { outline: 1px solid var(--halo-yellow); outline-offset: 4px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .title span, .links { animation: none; }
  }
</style>
</head>
<body>
<main class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <h1 class="title" aria-label="ALMOSTRANGERS"><span style="--i:0">A</span><span style="--i:1">L</span><span style="--i:2">M</span><span style="--i:3">O</span><span style="--i:4">S</span><span style="--i:5">T</span><span style="--i:6">R</span><span style="--i:7">A</span><span style="--i:8">N</span><span style="--i:9">G</span><span style="--i:10">E</span><span style="--i:11">R</span><span style="--i:12">S</span></h1>
  <nav class="links" aria-label="Link">
    <a href="https://www.instagram.com/almostrangersmusic/">Instagram</a>
    <a href="https://www.instagram.com/almostrangersmusic/">@almostrangersmusic</a>
  </nav>
</main>

<script>
(function () {
  var CFG = {"pal": {"halo0": "rgba(255,190,90,", "halo1": "rgba(255,90,40,", "halo2": "rgba(150,20,30,", "c0": "rgba(255,244,205,", "c1": "rgba(255,150,60,", "c2": "rgba(220,50,40,", "glow": "rgba(255,170,70,", "ring0": "#ffe08a", "ring1": "#ff9a4a", "ring2": "#ff4a3a", "shadow": "rgba(255,110,60,0.9)"}};
  var TAU = Math.PI * 2;
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = rng(20261120);

  var N = 900, SEG = 7;
  var ang0 = new Float32Array(N), rn = new Float32Array(N), rc = new Float32Array(N), rph = new Float32Array(N);
  for (var i = 0; i < N; i++) {
    ang0[i] = TAU * (i + rand() * 0.8) / N;
    rn[i] = rand(); rc[i] = (rand() - 0.5) * 0.5; rph[i] = rand() * TAU;
  }
  var PX = new Float32Array(N * SEG), PY = new Float32Array(N * SEG);
  var stars = [];
  for (var k = 0; k < 70; k++) stars.push({ x: rand(), y: rand(), r: 0.6 + rand() * 0.9, sp: 0.4 + rand() * 1.2, ph: rand() * TAU });

  var tgt = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };

  function size() {
    var b = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, b.width); H = Math.max(1, b.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx = W / 2; cy = H * 0.46;
    R = Math.min(W * 0.24, H * 0.225);
  }

  // slowly drifting flare field: where flames are tall or short around the disc
  function field(a, t) {
    var v = 0.5 * Math.sin(3 * a + t * 0.30) + 0.3 * Math.sin(7 * a - t * 0.50 + 1) + 0.2 * Math.sin(13 * a + t * 0.70 + 2);
    return Math.max(0.05, 0.55 + 0.55 * v);
  }

  function draw(t) {
    var P = CFG.pal;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#010208';
    ctx.fillRect(0, 0, W, H);

    var e = Math.max(0, t - 6);
    var ramp = Math.min(1, 0.15 + e / 3.5);
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.8);

    ctx.fillStyle = '#fff';
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.10 + 0.14 * Math.sin(t * st.sp + st.ph);
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';

    // colored halo, two layers
    var g1 = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 2.6);
    g1.addColorStop(0, P.halo0 + (0.40 + 0.22 * pulse) * ramp + ')');
    g1.addColorStop(0.18, P.halo1 + (0.22 + 0.14 * pulse) * ramp + ')');
    g1.addColorStop(0.6, P.halo2 + (0.06 * ramp) + ')');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 2.6, 0, TAU); ctx.fill();

    // flame filaments: wavy, flickering, tall where the field is strong
    var r0 = R * 1.005;
    for (var n = 0; n < N; n++) {
      var a = ang0[n] + t * 0.012;
      var L = R * (0.08 + 2.3 * Math.pow(field(a, t), 1.3) * Math.pow(rn[n], 0.9) * (0.8 + 0.2 * Math.sin(t * 1.3 + rph[n]))) * (0.85 + 0.3 * pulse) * ramp;
      var curl = rc[n] * (0.6 + 0.4 * Math.sin(t * 0.4 + rph[n]));
      for (var j = 0; j < SEG; j++) {
        var sv = j / (SEG - 1);
        var rr = r0 + L * sv, aa = a + curl * sv * sv;
        PX[n * SEG + j] = cx + Math.cos(aa) * rr;
        PY[n * SEG + j] = cy + Math.sin(aa) * rr;
      }
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var passes = [
      [0, 2, P.c0, 2.6, 0.10],
      [0, 2, P.c0, 1.2, 0.6],
      [2, 4, P.c1, 0.9, 0.5],
      [4, 6, P.c2, 0.7, 0.32]
    ];
    for (var p = 0; p < passes.length; p++) {
      var ps = passes[p];
      ctx.strokeStyle = ps[2] + ps[4] + ')';
      ctx.lineWidth = ps[3];
      ctx.beginPath();
      for (var m = 0; m < N; m++) {
        var o = m * SEG;
        ctx.moveTo(PX[o + ps[0]], PY[o + ps[0]]);
        for (var q = ps[0] + 1; q <= ps[1]; q++) ctx.lineTo(PX[o + q], PY[o + q]);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // bright inner glow hugging the disc
    var g2 = ctx.createRadialGradient(cx, cy, R, cx, cy, R * 1.3);
    g2.addColorStop(0, P.glow + (0.55 + 0.3 * pulse) * ramp + ')');
    g2.addColorStop(1, P.glow + '0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, TAU); ctx.fill();

    // the moon and its glowing ring
    ctx.globalCompositeOperation = 'source-over';
    var mx = Math.cos(t * 0.12) * R * 0.012 + ptr.x * R * 0.025;
    var my = Math.sin(t * 0.09) * R * 0.012 + ptr.y * R * 0.02;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx + mx, cy + my, R * 1.002, 0, TAU); ctx.fill();

    var rg = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rg.addColorStop(0, P.ring0); rg.addColorStop(0.5, P.ring1); rg.addColorStop(1, P.ring2);
    ctx.strokeStyle = rg; ctx.lineWidth = 2.4;
    ctx.shadowColor = P.shadow; ctx.shadowBlur = (14 + 22 * pulse) * ramp;
    ctx.beginPath(); ctx.arc(cx + mx, cy + my, R * 1.012, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * ramp) + ')'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(cx + mx, cy + my, R * 1.008, 0, TAU); ctx.stroke();
  }

  size();
  window.addEventListener('resize', function () { size(); if (still) draw(14); });
  if (still) { draw(14); return; }
  window.addEventListener('pointermove', function (e) {
    var b = cv.getBoundingClientRect();
    tgt.x = ((e.clientX - b.left) / b.width - 0.5) * 2;
    tgt.y = ((e.clientY - b.top) / b.height - 0.5) * 2;
  });
  var t0 = performance.now();
  function loop(now) {
    ptr.x += (tgt.x - ptr.x) * 0.04; ptr.y += (tgt.y - ptr.y) * 0.04;
    draw((now - t0) / 1000 + 6);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
